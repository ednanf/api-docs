openapi: 3.0.3

info:
  title: Game Journal API
  version: 1.0.1
  description: |
    REST API for the **Game Journal** application — a personal gaming journal that lets
    users log the games they play, the platform they play on, the status of each game and
    a personal rating, and browse aggregated statistics about their backlog.

    The API is implemented with **Node.js + Express 5 + TypeScript** and stores data in
    **MongoDB** through **Mongoose 8**. Authentication is stateless and based on
    **JWT (HS256)** tokens; passwords are hashed with **bcrypt** (10 salt rounds).

    ---

    ## Base URL

    Every endpoint lives under the `/api/v1` prefix. The frontend talks to the backend
    through an Axios instance whose `baseURL` already contains `/api/v1`, so request
    paths in this document are relative to that prefix
    (for example `/users/login` means `POST {server}/api/v1/users/login`).

    ## Response envelope

    Every JSON response produced by the application code (success **and** error) uses the
    same envelope:

    ```json
    {
      "status": "success",
      "data": { }
    }
    ```

    * `status` — `"success"` or `"error"`.
    * `data` — the payload of the response. On errors it always contains a `message`
      string describing what went wrong.

    Two exceptions to this rule are documented explicitly:

    * **429 Too Many Requests** — emitted by the rate limiter *before* the application
      error handler runs. Its body is **not** wrapped in the envelope
      (`{"status": 429, "error": "Too many requests, please try again later."}`).
    * **404 Not Found (unknown route)** — still uses the standard envelope, with the
      message `Not Found - {originalUrl}`.

    ## Authentication

    Endpoints under `/journal-entries` and `DELETE /users/delete` are protected. Send the
    JWT returned by `/users/register` or `/users/login` in the `Authorization` header:

    ```
    Authorization: Bearer <token>
    ```

    The token payload contains a single custom claim, `userId`, which holds the
    hexadecimal string representation of the user's MongoDB `_id`:

    ```json
    { "userId": "507f1f77bcf86cd799439011", "iat": 1705314600, "exp": 1705919400 }
    ```

    Tokens are signed with `HS256` and expire after the lifetime configured in the
    `JWT_LIFETIME` environment variable (for example `7d`).

    The API always answers with **401 Unauthorized** and a descriptive message when the
    header is missing or malformed, the token is invalid/expired/tampered with, or the
    token payload does not contain a `userId` claim.

    ## Request processing pipeline

    Every request goes through the following middleware chain, in this order:

    1. `express.json()` — parses JSON bodies.
    2. `cors()` — allows the configured front-end origins (`GET`, `POST`, `PATCH`, `DELETE`).
    3. `rateLimit()` — 300 requests per IP per 15-minute window.
    4. `helmet()` — sets the standard security headers.
    5. `morgan('tiny')` — request logging.
    6. Route level, in this order:
       * `POST /users/register`, `POST /users/login` — `xss()` (sanitizes the body,
         query and params) → `validateZodSchemas()` (validates the body and **strips
         unknown properties**) → controller.
       * `DELETE /users/delete` — `authenticate()` (verifies the JWT) → controller.
       * `GET`/`POST /journal-entries` — `authenticate()` → (`xss()` →
         `validateZodSchemas()` for `POST`) → controller.
       * `GET`/`PATCH`/`DELETE /journal-entries/{id}` — `authenticate()` →
         `validateObjectId('id')` (validates the `:id` path parameter) → (`xss()` →
         `validateZodSchemas()` for `PATCH`) → controller.

    The XSS sanitizer removes HTML tags from string values of the body, the query
    string and the route parameters before the request reaches the controller.

    ## Validation

    Bodies are validated with **Zod v4**. Validation failures produce a `400 Bad Request`
    whose `message` is the list of individual Zod issue messages joined with `". "`.
    For example, sending an invalid email *and* a short password yields:

    ```json
    {
      "status": "error",
      "data": {
        "message": "Email must be a string. Password must be at least 6 characters long"
      }
    }
    ```

    ## Ownership

    Journal entries are strictly scoped to their owner. Every read, update and delete is
    filtered by `createdBy === authenticated userId`, so a user can never see or modify
    another user's entries — the entry simply appears as `404 Not Found`.

    ## Rate limiting

    `300` requests per IP address per 15-minute rolling window. Every response carries
    the `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` headers
    (`X-RateLimit-Reset` is a UNIX timestamp in seconds). Exceeding the window returns
    `429 Too Many Requests`, together with a `Retry-After` header holding the number
    of seconds to wait for the window to reset.

    ## Other response headers

    `helmet` adds the following headers to every response:
    `Content-Security-Policy`, `Cross-Origin-Opener-Policy: same-origin`,
    `Cross-Origin-Resource-Policy: same-origin`, `Origin-Agent-Cluster: ?1`,
    `Referrer-Policy: no-referrer`, `Strict-Transport-Security: max-age=31536000; includeSubDomains`,
    `X-Content-Type-Options: nosniff`, `X-DNS-Prefetch-Control: off`,
    `X-Download-Options: noopen`, `X-Frame-Options: SAMEORIGIN`,
    `X-Permitted-Cross-Domain-Policies: none` and `X-XSS-Protection: 0`.

    ## CORS

    Only the following origins are accepted by the browser:

    * `http://localhost:5173`
    * `http://10.0.0.102:5173`
    * `http://10.0.0.102:4173`
    * `https://game-journal-seven.vercel.app`
    * `https://game-journal-ednan.vercel.app`
    * `https://game-journal.frizzera.dev`

    Allowed methods: `GET`, `POST`, `PATCH`, `DELETE`.

    ## Notes

    * The production server is hosted on Render's free tier, so the **first** request
      after a period of inactivity may take a while while the instance wakes up.
    * The auth token is stored in `localStorage` by the front-end (instead of cookies)
      to avoid CORS complications, particularly on WebKit/iOS.
