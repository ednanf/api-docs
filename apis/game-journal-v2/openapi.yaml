openapi: 3.1.0

info:
  title: Game Journal V2 API
  version: 1.0.0
  summary: HTTP API of the Game Journal V2 backend (Express + MongoDB + JWT).
  description: |
    REST API for **Game Journal V2**, the backend of an offline-first journaling PWA for video games.
    The frontend (React + Vite PWA) treats IndexedDB as its source of truth and uses this API to
    synchronise in the background, so this contract is intentionally small, explicit and strictly typed.

    ---

    ## 1. Base path & versioning

    Every route is mounted under `/api/v1` (`src/app.ts`):

    | Mount point        | Router                | Access          |
    | ------------------ | --------------------- | --------------- |
    | `/api/v1/auth`     | `authRoutes`          | Public          |
    | `/api/v1/user`     | `userRoutes`          | JWT required    |
    | `/api/v1/entries`  | `journalEntriesRoutes`| JWT required    |

    ---

    ## 2. Response envelope

    Every JSON response produced by a controller or by the central error handler uses the same envelope:

    ```json
    {
      "status": "success",
      "data": { "message": "..." }
    }
    ```

    ```json
    {
      "status": "error",
      "data": { "message": "..." }
    }
    ```

    * `status` — literal string `"success"` or `"error"`.
    * `data` — the payload on success, the error details on failure.
    * Successful payloads are **not** uniform: some carry a `message` (all auth/user payloads and the
      single-entry endpoints do), while `GET /api/v1/entries` returns `{ entries, nextCursor }` and
      `GET /api/v1/entries/statistics` returns `{ message, lifetime, byYear }`.

    Two responses do **not** follow the envelope and are documented explicitly:

    * `429 Too Many Requests` — emitted by the rate limiter with the body
      `{ "status": 429, "error": "Too many requests, please try again later." }` (`status` is a *number*
      and the payload key is `error`, not `data`).
    * Unmatched routes — see §7.

    ---

    ## 3. Authentication

    * `POST /api/v1/auth/register` and `POST /api/v1/auth/login` return a signed JWT.
    * The token is a **HS256** JWT whose payload is `{ "userId": "<24-hex ObjectId>", "iat": <n>, "exp": <n> }`.
      Its lifetime comes from the `JWT_LIFETIME` environment variable (`30d` in the repository's `.env`).
    * Protected routes read the token from the `Authorization` header using the `Bearer <token>` scheme.
      The token is verified with the `JWT_SECRET` environment variable; the `userId` claim is the only
      identity source used downstream.
    * The API is **stateless**: tokens are not stored server-side, `POST /api/v1/auth/logout` does not
      revoke anything, and changing the password does not invalidate already-issued tokens. The client is
      responsible for discarding the token.
    * Passwords are hashed with bcrypt (10 salt rounds) by a Mongoose `pre('save')` hook and are never
      returned by any endpoint.

    ---

    ## 4. Input handling

    For every `POST`/`PATCH` endpoint the request body goes through two middleware layers **in this order**:

    1. **XSS sanitisation** (`express-xss-sanitizer` → `sanitize-html` defaults): the tag set is reduced to
       a safe allow-list, all attributes are stripped, the contents of `script` and `style` elements are
       dropped and bare `&`, `<`, `>` are entity-encoded. The sanitised value is what gets validated and
       persisted (e.g. `notes: "Runs & roses"` is stored as `"Runs &amp; roses"`).
    2. **Zod validation** (`src/zodSchemas`): the parsed (and therefore trimmed/coerced) result *replaces*
       `req.body`. Unknown keys are rejected because every body schema is `.strict()`.

    Validation failures are reported as `400` with the Zod issue messages joined by `". "`:

    | Situation                              | `data.message`                                                            |
    | -------------------------------------- | ------------------------------------------------------------------------- |
    | Malformed e-mail                       | `Invalid email address`                                                   |
    | Password shorter than 6 characters     | `Password must contain at least 6 characters`                              |
    | Unknown key in the body                | `Unrecognized key: "foo"`                                                 |
    | Missing field                          | `Invalid input: expected string, received undefined`                       |
    | Invalid `status`                       | `Invalid option: expected one of "started"\|"completed"\|"revisited"\|"paused"\|"dropped"` |
    | Non-ISO `entryDate`                    | `Date must be a valid ISO datetime string.`                                |
    | `status: "completed"` without `rating` | `Rating is required when status is completed.`                            |
    | `rating` on a non-completed entry      | `Rating is only allowed for completed entries.`                           |

    ---

    ## 5. Data ownership (BOLA protection)

    Every journal-entry query is scoped by the authenticated `userId`, and every user query is scoped by
    the `userId` taken from the token. Requesting an entry that belongs to somebody else returns `404`
    (not `403`), so the API never confirms the existence of foreign resources.

    ---

    ## 6. Rate limiting

    A global limiter allows **300 requests per 15 minutes per IP** (`src/configs/rateLimitOptions.ts`).
    It is registered before the CORS middleware, so it applies to every endpoint, including the public
    ones, and it also counts preflight requests.

    * Successful responses carry `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`.
    * Exceeding the quota returns `429` with `Retry-After: 900` and the non-envelope body
      `{ "status": 429, "error": "Too many requests, please try again later." }`.

    ---

    ## 7. CORS, security headers and unmatched routes

    **CORS** (`src/configs/corsOptions.ts`) — allowed origins:

    * `http://localhost:5173`
    * `http://localhost:4173`
    * `http://10.0.0.102:4173`
    * `http://10.0.0.102:5173`
    * `https://journal.frizzera.dev`
    * `https://game-journal-v2.vercel.app`

    Allowed methods: `GET`, `POST`, `PATCH`, `DELETE`. Preflight (`OPTIONS`) requests are answered with
    `200` and an empty body. Requests from an origin that is not on the list are still executed by the
    server, but no `Access-Control-Allow-Origin` header is returned, so the browser blocks the response.

    **Security headers** — `helmet()` adds `Content-Security-Policy`, `Cross-Origin-Opener-Policy`,
    `Cross-Origin-Resource-Policy`, `Origin-Agent-Cluster`, `Referrer-Policy: no-referrer`,
    `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`, `X-DNS-Prefetch-Control`,
    `X-Download-Options`, `X-Frame-Options: SAMEORIGIN`, `X-Permitted-Cross-Domain-Policies` and
    `X-XSS-Protection: 0` to every response.

    **Unmatched routes** — `errorHandler` is registered *before* `notFound` in `src/app.ts`, so the
    `NotFoundError` raised by the catch-all never reaches the JSON error handler. Unmatched paths (and
    unsupported methods on a known path) therefore fall through to Express' default handler and are
    answered with an **HTML** body and status `404` — not with the JSON envelope.

    ---

    ## 8. Pagination

    `GET /api/v1/entries` uses keyset ("cursor") pagination sorted by `entryDate` descending and `_id`
    descending. The server fetches `limit + 1` documents to detect whether another page exists. When a
    further page exists, `data.nextCursor` contains the base64 encoding of
    `{"entryDate":"<ISO>","_id":"<hex>"}`; otherwise it is `null`. The cursor is opaque — clients must
    send it back verbatim. A malformed cursor is ignored and the first page is returned.
